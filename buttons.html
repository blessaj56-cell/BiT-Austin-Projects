<!DOCTYPE html>
<html>
    <head>
<style>
    .subscribe-button {
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        height: 35px;
        width: 105;
        border-radius: 3px;
        corner-shape: scoop;
        cursor: pointer;
        margin-right: 10px;
        transition: opacity 0.15s;
    }

    .subscribe-button:hover {
        opacity: 0.8;
    }

    .subscribe-button:active {
        opacity: 0.5;
    }

    .join-button {
        background-color: white;
        border-color: rgb(57, 142, 240);
        border-style: solid;
        border-width: 1px;
        color: rgb(57, 142, 240);
        height: 35px;
        width: 66px;
        border-radius: 3px;
        cursor: pointer;
        margin-right: 10px;
        transition: background-color 3s, color 3s;
    }

    .join-button:hover {
        background-color: rgb(57, 142, 240);
        color: white;
    }

    .join-button:active {
        opacity: 0.7;
    }

    .like-button {
        background-color: rgb(57, 142, 240);
        color: white;
        border: none;
        height: 35px;
        width: 66px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
    }

    .like-button:hover {
        box-shadow: 5px 5px 10px rgba(4, 21, 39, 0.15);
    }

    .like-button:active {
        opacity: 0.5;
    }

    .title {
        color: rgb(57, 142, 240);
        font-family:'Segoe UI';
        font-weight: 900;
    }

    .subtitle {
        color: black;
        font-family: 'Segoe UI';
        font-weight: 400;
        font-size: 20px;
    }

    .enroll {
        background-color: rgb(57, 142, 240);
        border: none;
        color: white;
        font-family: 'Segoe UI';
        font-weight: 700;
        height: 36px;
        width: 100px;
        border-radius: 5px;
        margin-right: 15px;
    }

    .learn {
        background-color: white;
        border-width: 1px;
        border-color: rgb(57, 142, 240);
        color: rgb(57, 142, 240);
        font-family: 'Segoe UI';
        font-weight: 700;
        height: 36px;
        width: 110px;
        border-radius: 5px;
        border-style: solid;
    }

    .input-card {
        background-color: #e0e9e9;
        border-radius: 5px;
        height: 270px;
        width: 350px;
        border-color: rgb(57, 142, 240);
        border-width: 1px;
        border-style: solid;

    }
    
    .input-group {
        position: relative;
        width: 300px;
    }

    .input-group input {
        width: 100%;
        padding: 14px 10px;
        font-size: 16px;
        border: 1px solid rgb(57, 142, 240);
        outline: none;
        border-radius: 4px;
        corner-shape: scoop;
    }

    .input-group label {
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        color: rgb(57, 142, 240);
        font-size: 16px;
        pointer-events: none;
        transition: 0.3s ease;
        background-color: white;
        padding: 0 5px;
    }

    .input-group input:focus+label, .input-group input:valid+label {
        top: -1px;
        font-size: 14px;
        color: #777;
    }


</style>

</head>

<body>

<button class="subscribe-button">Subscribe</button>

<button class="join-button">Join</button>

<button class="like-button">Like</button>


<h1 class="title">Welcome To Christ Bethel Montessori</h1>
<p class="subtitle">Where Learners acquire Knowledge and Skills!</p>

<div>

<button class="learn">Learn More</button>
</div>

</div>

</body>

</html>
