<!DOCTYPE html>

<html>
<head>
    <title>My first Website</title>
</head>
<body>

    
    <form>

        <div>
        <label for="fname">First name</label>
        <input type="text" id="fname" name="fname" placeholder="Spongebob" required>
        </div>

        <br>

        <div>
        <label for="lname">Last name</label>
        <input type="text" id="lname" name="lname" placeholder="Squarepants" required>
        </div>

        <br>

        <div>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" maxlength="12" required>
        </div>

         <br>

        <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="spants@gmail.com" required>
        </div>

        <br>

        <div>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+233(0) 535 194 1171" required>
        </div>

        <br>

        <div>
        <label for="bdate">Date of Birth</label>
        <input type="date" id="bdate" name="bdate">
        </div>

        <br>

        <div>
        <label for="title"> Title</label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." name="title" value="Mr.">

        <label for="Mrs.">Mrs.</label>
        <input type="radio" id="Mrs." name="title" value="Mrs.">

        <label for="Dr.">Dr.</label>
        <input type="radio" id="Dr." name="title" value="Dr.">

        </div>

        <br>

        <div>
        <label for="payment"> Payment option</label>
        <select id="payment" name="payment">
            <option value="Mobile Money">Mobile Money</option>
            <option value="Bank">Bank</option>
            <option value="Cash">Cash</option>
        </select>
        </div>

        <br>

        <div>
        <label for="remember"> Remember Me</label>
        <input type="checkbox" id="remember" name="remember">
        </div>

        <br>

        <div>
            <input type="reset">
        </div>

        <br>

        <div>
            <input type="submit">
        </div>

    </form>
    </span>

</body>
</html>
