<!DOCTYPE html>
<html>
    <head>
        <title>First Test</title>
        <link rel="stylesheet" href="">
        <style>
    
            .head {
                font-family: 'Segoe UI';
                font-weight: 900;
                font-size: 20px;
                margin-bottom: 0;
            }

            .font {
                font-family: 'Segoe UI';
                font-weight: 700;
                margin-right: 20px;
            }

            .font button {
                height: 30px;
                width: 100px;
                font-family: 'Segoe UI';
                font-weight: 700;
                border-radius: 5px;
                border: none;
                color: white;
                

            }

            .a1 {
                background-color: brown;
                margin-right: 10px;
           }

           .a2 {
                background-color:blueviolet;
                margin-right: 30px;
           }

           .a3 {
                background-color:darkorange;
           }

           .font2 {
                font-family: 'Segoe UI';
                font-weight: 700;
            }

            .font2 button {
                padding: 7px 30px;
                font-family: 'Segoe UI';
                font-weight: 700;
                border-radius: 5px;
                border: none;
                color: white;
                margin-right: 10px;
            }

           .b1 {
                background-color: brown;
           }

           .b2 {
                background-color:blueviolet;
           }

           .b3 {
                background-color:darkorange;
           }
        </style>
    </head>

    <body>
      <h1 class="head">PADDINGS AND MARGINS</h1>

      <br>

      <div class="font">
      <p>Margins</p>

      <button class="a1">First</button>

      <button class="a2">Second</button>

      <button class="a3">Third</button>
      </div>

      <br>
      
      <div class="font2">
      <p>Paddings</p>

      <button class="b1">First</button>

      <button class="b2">Second</button>

      <button class="b3">Third</button>
      </div>
    </body>
</html>
